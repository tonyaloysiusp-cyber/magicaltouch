name: Update package-lock
# Keeps package-lock.json in step with package.json. Cloudflare builds install
# strictly from the lockfile (npm ci), so an out-of-date lockfile fails them.
# Runs when package.json changes on main (or by hand) and commits the result.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Check it installs cleanly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit if changed
        run: |
          if git diff --quiet package-lock.json; then echo "Lockfile already up to date"; exit 0; fi
          git config user.name "mt-lockfile"
          git config user.email "lockfile@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package-lock.json to match package.json"
          git push
