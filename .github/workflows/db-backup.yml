name: Database backup
# Weekly encrypted backup of the whole database (templates, designs, users'
# data). The Supabase free plan keeps no backups of its own.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Supabase → Project settings → Database → Connection string
#                       (Session pooler, URI, with the database password filled in)
#   BACKUP_PASSPHRASE   any long passphrase you keep safe — needed to open a backup
# Backups are encrypted before upload because this repository is public.
# To restore: download the artifact, then
#   gpg -d backup.sql.gz.gpg | gunzip | psql "<connection string>"
on:
  schedule:
    - cron: '17 22 * * 0'   # Mondays 02:17 Dubai time
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        id: s
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "::warning::Backup skipped: add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else echo "ok=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Install PostgreSQL 17 client
        if: steps.s.outputs.ok == 'yes'
        run: |
          sudo apt-get install -y -q curl ca-certificates >/dev/null
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -s -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q postgresql-client-17 >/dev/null
      - name: Dump, compress and encrypt
        if: steps.s.outputs.ok == 'yes'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -eo pipefail
          mkdir out
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --no-owner --no-privileges --schema=public --schema=auth --schema=storage \
            | gzip -9 | gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o out/backup.sql.gz.gpg
          ls -la out
          echo "Backup size: $(du -h out/backup.sql.gz.gpg | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep for 90 days
        if: steps.s.outputs.ok == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_number }}
          path: out/backup.sql.gz.gpg
          retention-days: 90
