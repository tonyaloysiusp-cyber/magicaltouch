name: Apply database change
# Applies ONE migration file from supabase/migrations in a single transaction
# (all or nothing). Run it from the Actions tab or `gh workflow run`, naming the
# file — no Supabase dashboard approval needed, which works from an iPad.
# Needs the SUPABASE_DB_URL repository secret (see db-backup.yml).
on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration file name, e.g. 0049_template_quality.sql'
        required: true
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          FILE: ${{ inputs.migration }}
        run: |
          set -e
          [ -n "$DB" ] || { echo "::error::Add the SUPABASE_DB_URL repository secret first."; exit 1; }
          case "$FILE" in *[!A-Za-z0-9._-]*|'') echo "::error::Bad file name"; exit 1;; esac
          test -f "supabase/migrations/$FILE" || { echo "::error::No such migration: $FILE"; exit 1; }
          sudo apt-get install -y -q postgresql-client >/dev/null
          psql "$DB" -v ON_ERROR_STOP=1 --single-transaction -f "supabase/migrations/$FILE"
          echo "Applied $FILE" >> "$GITHUB_STEP_SUMMARY"
