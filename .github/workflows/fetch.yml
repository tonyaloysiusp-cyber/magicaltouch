name: Fetch free photos
on:
  push:
    branches: [assets-fetch3]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow requests
      - run: python fetch.py
        timeout-minutes: 150
        continue-on-error: true
      - name: Publish
        if: always()
        run: |
          cd out
          git init -q -b assets-previews3
          git config user.name "mt-assets"; git config user.email "assets@users.noreply.github.com"
          git add -A; git commit -qm "photo previews"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" assets-previews3
