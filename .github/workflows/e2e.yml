name: Editor E2E
on:
  push:
    branches-ignore: [e2e-results, shots-out, shots-tool, smoke-mcp, data-out, data-hashtags, data-meta, fonts-out2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rqkjogzljsbufbrdlbfr.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxa2pvZ3psanNidWZicmRsYmZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNzgyMDcsImV4cCI6MjEwNDg1NDIwN30.-OHCqhZNWsdlbkIE3qUV6It5VUoAN1lQDUFCRLtUaPM
      NEXT_PUBLIC_E2E: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and test
        run: bash e2e/ci.sh
      # Turns the run red when a type error, unit test or browser check fails,
      # and prints exactly which ones in the log and the run summary.
      - name: Test summary
        if: always()
        run: node e2e/summary.mjs
      # Results are kept as a downloadable artifact. (They used to be pushed to an
      # "e2e-results" branch, which made Vercel start a failing build every time.)
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-out
          retention-days: 14
          if-no-files-found: ignore
