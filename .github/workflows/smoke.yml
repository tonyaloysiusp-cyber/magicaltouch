name: smoke
on: { push: { branches: [smoke-mcp] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.magicaltouchdesign.com
          for p in /templates/collection/dwp-emerald-happy-diwali-mandala-instagram-post.webp /templates/collection/dwp-emerald-happy-diwali-mandala-instagram-post-preview.webp "/templates?occasion=Diwali" /templates; do curl -s -o /dev/null -w "%{http_code} %{size_download} $p\n" "$B$p"; done
          curl -s "$B/templates?q=diwali" | grep -o 'dwp-[a-z0-9-]*' | sort -u | head -8
          curl -s "$B/templates" | grep -o 'dwp-[a-z0-9-]*' | sort -u | wc -l
