name: smoke
on: { push: { branches: [smoke-mcp] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.magicaltouchdesign.com
          curl -s -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" $B/ > home.html
          grep -o '<meta[^>]*\(og:image"\|twitter:image\|thumbnail\)[^>]*>' home.html | head -4
          grep -o 'primaryImageOfPage[^}]*' home.html | head -1
          curl -s $B/image-sitemap.xml | grep -o '<url><loc>https://www.magicaltouchdesign.com/</loc>[^/]*/[^<]*<[^<]*' | head -1
          for p in /home/ad/poster.webp /home/ad/poster-720.webp /home/ad/poster-light.webp /home/ad/cover.webp; do curl -s -o /dev/null -w "%{http_code} $p\n" $B$p; done
          curl -s -o /dev/null -w "indexnow %{http_code}\n" "https://api.indexnow.org/indexnow?url=$B/&key=b2e48e40a28ff25772f97a10d0c1869a"
