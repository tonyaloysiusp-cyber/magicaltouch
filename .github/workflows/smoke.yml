name: smoke
on: { push: { branches: [smoke-mcp] } }
permissions: { contents: write }
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          mkdir out && cd out
          curl -sSfL -o NotoSansMalayalam.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansmalayalam/NotoSansMalayalam%5Bwdth,wght%5D.ttf"
          curl -sSfL -o NotoSansTamil.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstamil/NotoSansTamil%5Bwdth,wght%5D.ttf"
          curl -sSfL -o OFL.txt "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstamil/OFL.txt"
          ls -la
          git init -q && git checkout -q -b fonts-out2 && git add . && git -c user.name=bot -c user.email=bot@example.com commit -qm fonts
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fonts-out2
