name: smoke
on: { push: { branches: [smoke-check] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://magicaltouch.tonyaloysiusp.workers.dev
          for p in / /templates "/templates?kind=photo-album" /templates/forest-arch-birthday-story /templates/category/festivals /editor /login /signup /dashboard /api/public-templates /sitemap.xml /robots.txt /free-flyer-maker /templates/collection/21-and-fabulous-preview.jpg; do
            curl -s -o /tmp/b -m 60 -w "%{http_code} %{time_total}s %{size_download}B $p  " "$B$p"; grep -o '<title>[^<]*' /tmp/b | head -1; echo
          done
          echo "--- home error text check"; curl -s $B/ | grep -oiE 'application error|internal server error|hello world' | sort | uniq -c || true
