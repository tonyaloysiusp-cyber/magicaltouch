name: smoke
on: { push: { branches: [smoke-mcp] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.magicaltouchdesign.com
          for p in / /tutorials /remove-background /guides/magical-touch-design-handbook.pdf /guides/design-editor-guide.pdf /tutorials/background-removal-and-photo-cleanup; do curl -s -o /tmp/b -m 60 -w "%{http_code} %{size_download}B $p  " "$B$p"; grep -o '<title>[^<]*' /tmp/b | head -1; echo; done
          curl -s -o /dev/null -w "mockups -> %{http_code} %{redirect_url}\n" $B/mockups
          echo "breadcrumb on remover: $(curl -s $B/remove-background | grep -c 'aria-label="Breadcrumb"')"
          echo "mockups in menu: $(curl -s $B/ | grep -c 'href="/mockups"')"
          echo "face photos on home: $(curl -s $B/ | grep -o 'mt-813\|mt-589\|speaker-cutout' | wc -l)"
