name: smoke
on: { push: { branches: [smoke-mcp] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.magicaltouchdesign.com
          for p in / /home/ad/poster-light.webp /home/ad/poster-light-720.webp; do curl -s -o /dev/null -m 60 -w "%{http_code} %{size_download}B %{content_type} $p\n" "$B$p"; done
          curl -s $B/ | grep -o 'magical-touch-ad[^"?]*' | sort -u || true
          for u in /api/media/home/ad/magical-touch-ad-light.mp4 /api/media/home/ad/magical-touch-ad-light-720.mp4 /api/media/home/ad/magical-touch-ad.mp4; do curl -s -r 0-99 -D - -o /tmp/r $B$u | grep -iE "^(HTTP|content-range)"; done
