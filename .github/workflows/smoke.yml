name: smoke
on: { push: { branches: [smoke-mcp] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.magicaltouchdesign.com
          sleep 420
          for p in /templates/noir-green-basket-website-banner /templates/sand-india-south-asia-navratri-card /templates/coral-green-basket-website-banner; do curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}  $p\n" "$B$p"; done
          curl -s $B/sitemap.xml | grep -c "<loc>" || true
          curl -s $B/sitemap.xml | grep -c "noir-green-basket-website-banner" || true
