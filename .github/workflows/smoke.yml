name: smoke
on: { push: { branches: [smoke-mcp] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.magicaltouchdesign.com
          curl -s $B/api/public-templates -o /tmp/pt; ls -l /tmp/pt | awk '{print "public-templates bytes", $5}'
          echo "ivory: $(grep -o 'Ivory[^"]\{0,20\}' /tmp/pt | head -2 | tr '\n' ' ')"
          echo "albums v2 tag: $(grep -o 'albums-2026-11-v2' /tmp/pt | wc -l)"
          head -c 300 /tmp/pt; echo
          curl -s $B/ > /tmp/h; echo "Tools in header: $(grep -o 'Tools[^a-z]\{0,30\}' /tmp/h | head -3 | tr '\n' '|')"
          curl -s $B/login > /tmp/l; echo "login: $(grep -o 'Show password\|aria-pressed\|Hide password' /tmp/l | head -3 | tr '\n' '|') size $(wc -c < /tmp/l)"
          curl -s "$B/templates?q=wedding+album" | grep -o 'Ivory[^<]\{0,30\}' | head -2
