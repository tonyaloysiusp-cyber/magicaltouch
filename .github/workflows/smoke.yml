name: smoke
on: { push: { branches: [smoke-mcp] } }
permissions: { contents: write }
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Every sitemap address
        run: |
          B=https://www.magicaltouchdesign.com
          curl -s $B/sitemap.xml | grep -o "<loc>[^<]*</loc>" | sed 's/<[^>]*>//g' > urls.txt
          echo "URLs in sitemap: $(wc -l < urls.txt)"
          cat urls.txt | xargs -P 24 -I{} curl -s -o /dev/null -w "%{http_code} %{time_total} {}\n" --max-time 30 "{}" > status.txt
          echo "== status counts"; cut -d' ' -f1 status.txt | sort | uniq -c
          echo "== not 200"; grep -v "^200 " status.txt | head -60
          echo "== slowest"; sort -k2 -nr status.txt | head -8
          echo "== robots + extras"; for p in /robots.txt /image-sitemap.xml /manifest.webmanifest /api/public-templates /templates/noir-green-basket-website-banner; do curl -s -o /dev/null -w "%{http_code} %{size_download} $p\n" "$B$p"; done
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-audit --no-fund playwright@1.47.2 jsqr@1.4.0 >/dev/null && npx -y playwright@1.47.2 install --with-deps chromium >/dev/null
      - name: Key pages (desktop + phone)
        run: node tools/pages.mjs
      - name: Full editor test suite against the live site
        working-directory: site
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.47.2 jsqr@1.4.0 >/dev/null
          E2E_BASE=https://www.magicaltouchdesign.com node e2e/run.mjs > /dev/null 2>&1 || true
          node e2e/summary.mjs || true
      - name: Publish screenshots
        if: always()
        run: |
          mkdir -p pub && cp -r out/shots pub/ 2>/dev/null; cp out/pages.json pub/ 2>/dev/null; cp -r site/e2e-out/shots pub/e2e 2>/dev/null || true
          cd pub && git init -q && git checkout -q -b live-test && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm shots
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" live-test
