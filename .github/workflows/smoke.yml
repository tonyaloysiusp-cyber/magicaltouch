name: smoke
on: { push: { branches: [smoke-mcp] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.magicaltouchdesign.com
          for p in / /templates /editor /ai-studio /sitemap.xml /templates/family-album-sage-16-pages; do curl -s -o /tmp/b -m 60 -w "%{http_code} $p  " "$B$p"; grep -o '<title>[^<]*' /tmp/b | head -1; echo; done
          echo "ai-studio in sitemap: $(curl -s $B/sitemap.xml | grep -c ai-studio)"
          echo "ai-studio noindex: $(curl -s $B/ai-studio | grep -o 'noindex[^"]*' | head -1)"
          echo "AI on home: $(curl -s $B/ | grep -o 'AI Studio\|AI Template Studio\|free AI rebuild' | sort | uniq -c | tr '\n' ' ')"
