name: smoke
on: { push: { branches: [smoke-mcp] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.magicaltouchdesign.com
          for p in / /home/ad/magical-touch-ad.mp4 /home/ad/magical-touch-ad-720.mp4 /home/ad/poster.webp /photo-studio; do curl -s -o /dev/null -m 60 -w "%{http_code} %{size_download}B %{content_type} $p\n" "$B$p"; done
          curl -s -r 0-99 -o /dev/null -w "range %{http_code}\n" $B/home/ad/magical-touch-ad.mp4
