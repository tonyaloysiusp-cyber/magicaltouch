name: smoke
on: { push: { branches: [smoke-mcp] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.magicaltouchdesign.com
          for p in / /photo-studio /tutorials /create /privacy "/guides/photo-studio-guide.pdf?v=2" "/guides/magical-touch-design-handbook.pdf?v=2" "/guides/photo-studio-guide.webp?v=2"; do curl -s -o /dev/null -m 60 -w "%{http_code} %{size_download}B $p\n" "$B$p"; done
          curl -s $B/privacy | grep -o "Cloudflare</strong>[^<]*" | head -1
