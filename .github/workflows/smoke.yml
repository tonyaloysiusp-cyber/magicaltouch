name: smoke
on: { push: { branches: [smoke-mcp] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.magicaltouchdesign.com
          curl -s $B/sitemap.xml > sm.xml
          python3 - <<'PY'
          import json,re
          urls=re.findall(r'<loc>([^<]+)</loc>',open('sm.xml').read())[:10000]
          k='b2e48e40a28ff25772f97a10d0c1869a'
          json.dump({'host':'www.magicaltouchdesign.com','key':k,'keyLocation':f'https://www.magicaltouchdesign.com/{k}.txt','urlList':urls},open('body.json','w'))
          print('urls',len(urls))
          PY
          for e in https://api.indexnow.org/indexnow https://www.bing.com/indexnow https://yandex.com/indexnow; do curl -s -o /dev/null -w "$e %{http_code}\n" -X POST -H 'Content-Type: application/json; charset=utf-8' --data @body.json $e; done
