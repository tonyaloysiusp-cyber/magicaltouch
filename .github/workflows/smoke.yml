name: smoke
on: { push: { branches: [smoke-mcp] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.magicaltouchdesign.com
          for p in /templates/dwp-emerald-happy-diwali-mandala-instagram-post /templates/dwp-maroon-corporate-diwali-instagram-post /sitemap.xml; do curl -s -o /tmp/o -w "%{http_code} %{size_download} $p\n" "$B$p"; grep -o "<title>[^<]*" /tmp/o | head -1; done
          curl -s $B/sitemap.xml | grep -c "dwp-" || true
