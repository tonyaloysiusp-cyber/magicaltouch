# Screenshots of live pages for design review: run by hand (Actions → Screens),
# prints each screenshot as base64 JPEG in the log between markers.
name: Screens
on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Space-separated paths, e.g. "/ /tools /textile-studio"'
        required: true
        default: '/ /tools /textile-studio /print-size-calculator /editor'
      probe:
        description: 'Optional space-separated paths to fetch (status, type, size)'
        required: false
        default: ''
      selector:
        description: 'Optional CSS selector: screenshot just that element (2x)'
        required: false
        default: ''
      width:
        description: 'Viewport width'
        required: false
        default: '1440'
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe
        if: ${{ inputs.probe != '' }}
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          for u in $PROBE; do echo "PROBE $u => $(curl -s -o /tmp/b -w '%{http_code} %{content_type} %{size_download}' "https://magicaltouchdesign.com$u") $(head -c 120 /tmp/b | tr -dc '[:print:]')"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright
        run: |
          mkdir s && cd s && npm init -y >/dev/null && npm i playwright@1.47.2 sharp@0.33.5 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Shoot
        working-directory: s
        env:
          PATHS: ${{ inputs.paths }}
          WIDTH: ${{ inputs.width }}
          SEL: ${{ inputs.selector }}
        run: |
          cat > shoot.mjs <<'EOF'
          import { chromium } from 'playwright';
          import sharp from 'sharp';
          const b = await chromium.launch();
          const ctx = await b.newContext({ viewport: { width: Number(process.env.WIDTH || 1440), height: 900 }, deviceScaleFactor: process.env.SEL ? 2 : 1 });
          await ctx.addInitScript(() => { try { localStorage.setItem('mt:onboarded', '1'); } catch {} });
          const p = await ctx.newPage();
          for (const path of process.env.PATHS.split(/\s+/).filter(Boolean)) {
            try { await p.goto('https://magicaltouchdesign.com' + path, { waitUntil: 'networkidle', timeout: 60000 }); } catch {}
            await p.waitForTimeout(2500);
            let png;
            if (process.env.SEL) { const el = p.locator(process.env.SEL).first(); try { await el.scrollIntoViewIfNeeded({ timeout: 10000 }); await p.waitForTimeout(1500); png = await el.screenshot({ timeout: 15000 }); } catch (e) { console.log('selector failed', String(e).slice(0, 200)); } }
            if (!png) png = await p.screenshot({ fullPage: false });
            const jpg = await sharp(png).resize({ width: 1100 }).jpeg({ quality: 62 }).toBuffer();
            console.log(`=====SHOT ${path}=====`);
            const b64 = jpg.toString('base64');
            for (let i = 0; i < b64.length; i += 2000) console.log(b64.slice(i, i + 2000));
            console.log('=====END=====');
          }
          await b.close();
          EOF
          node shoot.mjs
