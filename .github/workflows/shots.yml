name: shots
on: { push: { branches: [shots-tool] } }
permissions: { contents: write }
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node shots.mjs
      - run: |
          git config user.name mt-shots; git config user.email shots@users.noreply.github.com
          git checkout --orphan shots-out && git rm -rqf --cached . >/dev/null
          git add -f shots && git commit -qm "screenshots [skip ci]" && git push -f origin shots-out
