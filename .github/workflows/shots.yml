name: shots
on: { push: { branches: [shots-tool] } }
permissions: { contents: write }
jobs:
  shots:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rqkjogzljsbufbrdlbfr.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxa2pvZ3psanNidWZicmRsYmZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNzgyMDcsImV4cCI6MjEwNDg1NDIwN30.-OHCqhZNWsdlbkIE3qUV6It5VUoAN1lQDUFCRLtUaPM
      NEXT_PUBLIC_E2E: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: { path: tool }
      - uses: actions/checkout@v4
        with: { ref: "${{ hashFiles('tool/ref.txt') != '' && 'nov-updates' || 'main' }}", path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: cd site && npm ci --no-audit --no-fund && (npm run build || npm run build)
      - run: cd site && npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: cd site && (npx next start -p 3000 > ../server.txt 2>&1 &) && for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3000 && break; sleep 1; done
      - run: cd site && cp ../tool/shots.mjs . && cd .. && cp tool/jobs.json . && BASE=http://localhost:3000 node site/shots.mjs; rm -rf site/shots; mv shots site/ || true
      - run: |
          cd tool; rm -rf shots; cp -r ../site/shots .
          git config user.name mt-shots; git config user.email shots@users.noreply.github.com
          git checkout --orphan shots-out && git rm -rqf --cached . >/dev/null
          git add -f shots && git commit -qm "screenshots" && git push -f origin shots-out
